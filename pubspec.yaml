name: thinking_orbs
description: >-
  Dotted thought-orb loading indicators for AI & agent UIs — six tuned states,
  two sizes, auto dark/light. A Dart/Flutter reimplementation of Jakub
  Antalik's thinking-orbs.
version: 0.1.0
homepage: https://github.com/Jakubantalik/thinking-orbs
repository: https://github.com/leofmarciano/thinking-orbs-flutter

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
